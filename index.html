<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Piano keys -->
  <div class="piano">
    <button class="key" data-note="C">C</button>
    <button class="key" data-note="D">D</button>
    <button class="key" data-note="E">E</button>
    <button class="key" data-note="F">F</button>
    <button class="key" data-note="G">G</button>
    <button class="key" data-note="A">A</button>
    <button class="key" data-note="B">B</button>
  </div>

  <!-- Sounds (audio tags) -->
  <audio id="C" src="sounds/A.mp3"></audio>
  <audio id="D" src="sounds/B.mp3"></audio>
  <audio id="E" src="sounds/C.mp3"></audio>
  <audio id="F" src="sounds/D.mp3"></audio>
  <audio id="G" src="sounds/E.mp3"></audio>
  <audio id="A" src="sounds/F.mp3"></audio>
  <audio id="B" src="sounds/G.mp3"></audio>

  <!-- JS file yaha link hoga -->
  <script src="script.js"></script>
</body>
</html>
